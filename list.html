function showAgencies(filtered) {
    const container = document.getElementById('agencies-container');
    container.innerHTML = '';
    filtered.forEach(a => {
        const div = document.createElement('div');
        div.className = 'agency';
        div.innerHTML = `<h3>${a.name}</h3>
                         <p>${a.address}</p>
                         <img src="${a.img}" alt="${a.name}">`;
        container.appendChild(div);
    });
}

function filterCategory(category) {
    if(category === 'All'){
        showAgencies(agencies);
    } else {
        showAgencies(agencies.filter(a => a.category === category));
    }
}

showAgencies(agencies);
