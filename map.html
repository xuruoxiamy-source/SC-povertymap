<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Agencies Map</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
  <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/9151/9151185.png">

  <style>
    .search-container {
      position: relative;
      width: 300px;
      margin: 0 auto;
      text-align: left;
    }

    #search-bar {
      width: 100%;
      padding: 8px;
      margin-bottom: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    #suggestions {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: white;
      border: 1px solid #ccc;
      max-height: 150px;
      overflow-y: auto;
      z-index: 1000;
      display: none;
      border-radius: 8px;
      font-size: 0.95rem;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }

    #suggestions div {
      padding: 8px;
      cursor: pointer;
    }

    #suggestions div:hover {
      background: #f0f0f0;
    }
  </style>
</head>

<body>
  <div class="navbar">
    <a href="index.html">Home</a>
    <a href="list.html">Agencies</a>
    <a href="map.html">Map</a>
  </div>

  <div class="container">
    <h1>Agencies Map</h1>

    <div id="buttons">
      <button class="category-btn" onclick="filterMarkers('All')">All</button>
      <button class="category-btn" onclick="filterMarkers('Shelter')">Shelter</button>
      <button class="category-btn" onclick="filterMarkers('Support')">Support</button>
      <button class="category-btn" onclick="filterMarkers('Food Bank')">Food Bank</button>
      <button class="category-btn" onclick="filterMarkers('Shower')">Shower</button>
    </div>

    <div class="search-container">
      <input type="text" id="search-bar" placeholder="Search agency by name">
      <div id="suggestions"></div>
    </div>

    <div id="map"></div>
  </div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script>
const agencies = [
  {name:"Salvation Army Booth Centre (Men)", category:"Shelter", coords:[43.161, -79.246]},
  {name:"Southridge Shelter (Co-Ed)", category:"Shelter", coords:[43.152, -79.249]},
  {name:"Summer Street Shelter (Co-Ed and couples)", category:"Shelter", coords:[43.144, -79.241]},
  {name:"The RAFT (age 16-24)", category:"Shelter", coords:[43.159, -79.240]},
  {name:"YWCA Women", category:"Shelter", coords:[43.166, -79.245]},
  {name:"YWCA Family", category:"Shelter", coords:[43.167, -79.244]},

  {name:"The Salvation Army", category:"Support", coords:[43.158, -79.243]},
  {name:"YWCA", category:"Support", coords:[43.166, -79.245]},
  {name:"Southridge Community Church and Shelter", category:"Support", coords:[43.152, -79.249]},
  {name:"RAFT", category:"Support", coords:[43.159, -79.240]},
  {name:"CASON", category:"Support", coords:[43.160, -79.243]},
  {name:"Positive Living Niagara", category:"Support", coords:[43.1585, -79.245]},
  {name:"Start Me Up Niagara", category:"Support", coords:[43.157, -79.246]},

  {name:"Community Care", category:"Food Bank", coords:[43.159, -79.247]},
  {name:"Food Bank", category:"Food Bank", coords:[43.156, -79.242]},
  {name:"Ozanam Center", category:"Food Bank", coords:[43.1575, -79.244]},
  {name:"Lincoln County Community Fridge", category:"Food Bank", coords:[43.155, -79.241]},

  {name:"Silver Spire United Church", category:"Shower", coords:[43.1585, -79.2435]}
];

const map = L.map('map').setView([43.158, -79.243], 13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  attribution:'&copy; <a href="https://openstreetmap.org">OpenStreetMap</a> contributors'
}).addTo(map);

let markers = [];

function addMarkers(list){
  markers.forEach(m => map.removeLayer(m));
  markers = [];
  list.forEach(a => {
    const marker = L.marker(a.coords).addTo(map)
      .bindPopup(`<b>${a.name}</b><br>${a.category}`);
    markers.push(marker);
  });
}

function filterMarkers(category){
  if(category === 'All'){
    addMarkers(agencies);
  } else {
    addMarkers(agencies.filter(a=>a.category===category));
  }
}

const searchBar = document.getElementById('search-bar');
const suggestions = document.getElementById('suggestions');

searchBar.addEventListener('input', function(){
  const value = this.value.toLowerCase();
  const filtered = agencies.filter(a=>a.name.toLowerCase().includes(value));

  suggestions.innerHTML = '';
  if (value && filtered.length > 0) {
    filtered.forEach(a => {
      const div = document.createElement('div');
      div.textContent = a.name;
      div.onclick = () => {
        searchBar.value = a.name;
        suggestions.style.display = 'none';
        addMarkers([a]);
      };
      suggestions.appendChild(div);
    });
    suggestions.style.display = 'block';
  } else {
    suggestions.style.display = 'none';
  }

  addMarkers(filtered);
});

filterMarkers('All');
</script>
</body>
</html>
